# Non-secret Cloud Run settings for the TrustCore API.
# Copy to deploy/cloud-run.env.yaml (git-ignored), replace every YOUR-/REPLACE value,
# then run deploy/cloud-run-deploy.sh. Secrets are NOT set here: they come from
# Secret Manager (see the script). All values must be strings.
ENVIRONMENT: "production"
CORS_ORIGINS: "https://YOUR-WEB-ORIGIN"
SUPABASE_URL: "https://YOUR-PROJECT-REF.supabase.co"
MOCK_BILLING: "false"
STRIPE_PRICE_ID_PER_SCAN: "price_REPLACE_launch_audit_29"
STRIPE_PRICE_ID_PRO: "price_REPLACE_pro_builder_49_monthly"
STRIPE_PRICE_ID_ENTERPRISE: "price_REPLACE_enterprise_monthly"
STRIPE_PER_SCAN_CREDITS: "1"
RATE_LIMIT_SCAN: "10/minute"
RATE_LIMIT_INGEST: "10/minute"
# Proxies in front of the container. After the first deploy, `curl <service-url>/health`
# from a normal client and set this to the reported forwarded_for_entries.
TRUSTED_PROXY_HOPS: "1"
LLM_EXPLAINER_PROVIDER: "mock"
